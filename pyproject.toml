[project]
name = "midi-to-tablature-nn-model"
version = "0.1.0"
description = "MIDI to guitar tablature transcription (neural + playability search), based on Kaliakatsos-Papakostas et al."
authors = [
    {name = "João Gabriel Oliveira",email = "jgolivjesus@gmail.com"}
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "datasets (>=3.0.0,<4.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "torch (>=2.13.0,<3.0.0)",
    "torchmetrics (>=1.9.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "src" }]

[dependency-groups]
dev = [
    "jupyter (>=1.1.1,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
]
